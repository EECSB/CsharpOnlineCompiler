<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C# Online Compiler</title>
    <meta name="description" content="This is an online C# compiler that runs directly in your browser. So, your code won't be sent to a backend server to be compiled. This is achieved by utilizing Blazor WASM(WebAssembly), which allows us to make and run C# apps(including the Roslyn compiler APIs) in a browser.">
    <base/>
    <script>
        const base = document.getElementsByTagName('base')[0];

        if (window.location.host.includes('localhost')) { //When developing.
            base.setAttribute('href', '/');
        } else {
            base.setAttribute('href', window.location.pathname);
        }
    </script>
    <script>
        //localStorage writes are best-effort: a full quota (or storage disabled in private browsing) must
        //never throw. An uncaught QuotaExceededError otherwise breaks the app mid-save — in a Blazor app it
        //pops the framework's fatal-error bar even when the failure is otherwise handled. Wrap setItem here,
        //before the app boots, to swallow the failure, warn, and fire an event the app can optionally handle.
        (function () {
            try {
                var proto = window.Storage && window.Storage.prototype;

                if (!proto || proto.__safeSetItem)
                    return;

                var original = proto.setItem;

                proto.setItem = function (key, value) {
                    try {
                        return original.call(this, key, value);
                    }
                    catch (e) {
                        console.warn('localStorage write failed (quota full or storage disabled): ' + key);

                        try {
                            window.dispatchEvent(new CustomEvent('storagequotaexceeded', { detail: { key: key } }));
                        }
                        catch (e2) { }
                    }
                };

                proto.__safeSetItem = true;
            }
            catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CsharpOnlineCompiler.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/JSUtils.js"></script>
    <script src="js/webpack-bundle/index.bundle.js"></script>
    <script src="js/IndexedDbInterop.js"></script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
